name: Deploy Static Content to Pages

on:
  push:
    branches: ["master"] # Change to "master" if your default branch uses master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact (Targeting /src)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src' # This tells GitHub to treat /src as the root website folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
